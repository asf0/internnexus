[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internnexus-core"
version = "0.1.0"
requires-python = ">=3.14"
description = "Shared utilities and domain definitions for InternNexus"
dependencies = [
    "httpx>=0.27.0",
    "tenacity>=9.1.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "pydantic-settings>=2.5.0",
    "pgvector>=0.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.11",
    "pyright>=1.1.400",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["internnexus_core*"]
namespaces = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "E402",
    "E501",
    "F601",
]

select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = ["internnexus_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
